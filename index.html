<!DOCTYPE html>
<html lang="fr" data-theme="frais">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portail Marketing François Lurton</title>
<meta name="description" content="Portail interne des applications marketing des Domaines François Lurton.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">

<!-- Apercu affiche quand le lien est partage (Teams, WhatsApp, Slack, Outlook...).
     IMPORTANT : og:url et og:image doivent etre des adresses ABSOLUES. Si le nom
     du depot GitHub change, corriger les deux lignes ci-dessous en consequence. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Portail Marketing François Lurton">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Portail Marketing François Lurton">
<meta property="og:description" content="Toutes les applications marketing du groupe, au même endroit.">
<meta property="og:url" content="https://domaines-francois-lurton.github.io/portail_marketing/">
<meta property="og:image" content="https://domaines-francois-lurton.github.io/portail_marketing/assets/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Portail Marketing François Lurton : Bible DFL, Wine Awards Tracker, Signature Email App, Press Tracker, Label Explorer.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Portail Marketing François Lurton">
<meta name="twitter:description" content="Toutes les applications marketing du groupe, au même endroit.">
<meta name="twitter:image" content="https://domaines-francois-lurton.github.io/portail_marketing/assets/og-image.png">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="shell">
  <div class="blob blob--1" aria-hidden="true"></div>
  <div class="blob blob--2" aria-hidden="true"></div>

  <header class="site-header">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name" id="brand-name">Portail Marketing</span>
    </div>
    <time class="site-header__date" id="header-date"></time>
  </header>

  <main class="main">

    <div class="hero">
      <h1 class="hero__title" id="hero-title">Bienvenue</h1>
      <p class="hero__subtitle" id="hero-subtitle">Boite à outils marketing François Lurton</p>
    </div>

    <div class="announcement" id="announcement" role="status">
      <span class="announcement__dot" aria-hidden="true"></span>
      <div class="announcement__viewport">
        <div class="announcement__track" id="announcement-track">
          <p class="announcement__item" id="announcement-item">
            <strong class="announcement__label"></strong>
            <span class="announcement__body"></span>
          </p>
        </div>
      </div>
    </div>

    <div class="search">
      <svg class="search__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="oklch(0.55 0.01 250)" stroke-width="2"></circle>
        <line x1="21" y1="21" x2="16.5" y2="16.5" stroke="oklch(0.55 0.01 250)" stroke-width="2" stroke-linecap="round"></line>
      </svg>
      <input
        class="search__input"
        id="search"
        type="search"
        autocomplete="off"
        placeholder="Rechercher une application..."
        aria-label="Rechercher une application">
      <span class="search__hint" aria-hidden="true">/</span>
    </div>

    <section aria-labelledby="section-title">
      <div class="section__head">
        <h2 class="section__title" id="section-title">Toutes les applications</h2>
        <span class="section__count" id="app-count"></span>
      </div>

      <div class="grid" id="app-grid"></div>

      <p class="empty" id="empty-state" hidden>
        Aucune application ne correspond à « <span id="empty-query"></span> ».
      </p>
    </section>

  </main>

  <footer class="site-footer">
    <p id="footer-text">Portail interne · François Lurton SA</p>
  </footer>
</div>

<noscript>
  <p style="text-align:center; padding:0 24px 40px; font-size:14px; color:#555;">
    Activez JavaScript pour afficher la liste des applications.
  </p>
</noscript>

<script src="config.js"></script>
<script src="assets/js/portal.js"></script>
</body>
</html>
