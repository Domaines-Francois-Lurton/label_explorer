<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Source de l'image de partage</title>
<!--
  Gabarit 1200x630 servant a generer assets/og-image.png (l'apercu affiche
  quand le lien est colle dans Teams, WhatsApp, Slack, Outlook...).
  Ce fichier n'est pas une page du portail : il n'existe que pour produire
  l'image. Pour la regenerer apres une modification, voir le README.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(120% 100% at 50% -10%, oklch(0.99 0.005 240) 0%, oklch(0.965 0.006 240) 55%, oklch(0.94 0.008 240) 100%);
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  .blob { position: absolute; border-radius: 50%; filter: blur(10px); }
  .blob--1 {
    top: -260px; right: -180px; width: 760px; height: 760px;
    background: radial-gradient(circle, oklch(0.9 0.03 250 / 0.4), transparent 70%);
  }
  .blob--2 {
    bottom: -340px; left: -200px; width: 720px; height: 720px;
    background: radial-gradient(circle, oklch(0.9 0.03 200 / 0.35), transparent 70%);
  }

  .card {
    position: relative;
    height: 100%;
    padding: 74px 88px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* --- Haut : marque --- */
  .mark-row { display: flex; align-items: center; gap: 20px; }
  .mark {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(160deg, oklch(0.6 0.14 250), oklch(0.48 0.15 255));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px oklch(0.5 0.15 255 / 0.32);
  }
  .mark::after {
    content: ""; width: 30px; height: 30px;
    border-radius: 9px; background: #fff; opacity: 0.95;
  }
  .eyebrow {
    font-size: 25px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: oklch(0.55 0.02 250);
  }

  /* --- Milieu : titre --- */
  .title {
    font-size: 82px; font-weight: 700; letter-spacing: -0.03em;
    color: oklch(0.22 0.01 250); line-height: 1.05;
  }
  .subtitle {
    font-size: 31px; font-weight: 400; color: oklch(0.48 0.01 250);
    margin-top: 18px;
  }

  /* --- Bas : les applications --- */
  /* Les pastilles doivent tenir sur une seule ligne (1024 px utiles).
     A partir de six applications, il faudra reduire encore ou passer
     sur deux rangees. */
  .apps { display: flex; gap: 10px; }
  .chip {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 16px 9px 9px;
    border-radius: 999px;
    background: oklch(1 0 0 / 0.72);
    box-shadow: 0 1px 2px oklch(0 0 0 / 0.05), inset 0 0 0 1px oklch(0 0 0 / 0.05);
  }
  .chip__badge {
    width: 32px; height: 32px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff; letter-spacing: 0.01em;
    box-shadow: 0 4px 10px oklch(0.3 0.02 250 / 0.18), inset 0 1px 0 oklch(1 0 0 / 0.25);
  }
  .chip__name {
    font-size: 17px; font-weight: 600; color: oklch(0.3 0.01 250);
    white-space: nowrap;
  }

  .footer {
    font-size: 20px; font-weight: 500; color: oklch(0.58 0.01 250);
    margin-top: 30px;
  }
</style>
</head>
<body>
  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>

  <div class="card">

    <div class="mark-row">
      <div class="mark"></div>
      <div class="eyebrow">Portail Marketing</div>
    </div>

    <div>
      <h1 class="title">Boite à outils marketing</h1>
      <p class="subtitle">Toutes les applications marketing du groupe, au même endroit.</p>
    </div>

    <div>
      <div class="apps">
        <div class="chip">
          <span class="chip__badge" style="background:linear-gradient(160deg, oklch(0.68 0.13 250), oklch(0.55 0.16 258));">BD</span>
          <span class="chip__name">Bible DFL</span>
        </div>
        <div class="chip">
          <span class="chip__badge" style="background:linear-gradient(160deg, oklch(0.72 0.13 165), oklch(0.58 0.14 165));">WA</span>
          <span class="chip__name">Wine Awards Tracker</span>
        </div>
        <div class="chip">
          <span class="chip__badge" style="background:linear-gradient(160deg, oklch(0.72 0.12 45), oklch(0.6 0.15 40));">SE</span>
          <span class="chip__name">Signature Email App</span>
        </div>
        <div class="chip">
          <span class="chip__badge" style="background:linear-gradient(160deg, oklch(0.7 0.13 320), oklch(0.56 0.16 320));">PT</span>
          <span class="chip__name">Press Tracker</span>
        </div>
        <div class="chip">
          <span class="chip__badge" style="background:linear-gradient(160deg, oklch(0.72 0.11 95), oklch(0.58 0.13 85));">LE</span>
          <span class="chip__name">Label Explorer</span>
        </div>
      </div>
      <p class="footer">François Lurton SA</p>
    </div>

  </div>
</body>
</html>
